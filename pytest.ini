[pytest]
addopts =
    # generate report with details of all (non-pass) test results
    -ra
    # show local variables in tracebacks
    --showlocals
    # report formatting changes suggested by black
    --black
    # verbose output
    --verbose
    # report test coverage percentage (for particular folder like cov=.)
    --cov=.
    # test coverage config file
    --cov-config=.coveragerc
    # check conditional coverage
    --cov-branch
    # don't show warnings in report
    --disable-warnings
norecursedirs =
    .git
    .pytest_cache
    .vscode
    .idea
    migrations
    venv
    psql-data
    src/pearlx_api_flex/db
    load_tests
    misc
