version: "3.8"
services:
  postgres:
    container_name: pearlx-api-postgres
    image: "postgres:13.4"
    restart: always
    ports:
      - "5432:5432"
    expose:
      - 5432
    volumes:
      - .local/psql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

  migration:
    container_name: pearlx-api-migration
    build: .
    environment:
      FLASK_APP: ${FLASK_APP}
      FLASK_ENV: ${FLASK_ENV}
      FLASK_DEBUG: ${FLASK_DEBUG}
      DATABASE_URL: postgresql+psycopg2://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SCHEDULER_ENABLED: 0
    command: pipenv run flask db upgrade
    depends_on:
     - postgres

  pearlx_api:
    container_name: pearlx-api
    build: .
    ports:
      - "5000:5000"
    expose:
      - 5000
    environment:
      FLASK_APP: ${FLASK_APP}
      FLASK_ENV: ${FLASK_ENV}
      FLASK_DEBUG: ${FLASK_DEBUG}
      DATABASE_HOST: postgres
      DATABASE_URL: postgresql+psycopg2://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      JWT_KEY: ${JWT_KEY}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS}
      SCHEDULER_ENABLED: 0
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      - postgres
      - migration

  prometheus:
    container_name: pearlx-api-prometheus
    image: prom/prometheus
    ports:
      - "9090:9090"
    expose:
      - 9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  mailhog:
    container_name: pearlx-api-mailhog
    image: mailhog/mailhog:latest
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    expose:
      - 1025
      - 8025
